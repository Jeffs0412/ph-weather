[project]
name = "weather"
version = "0.1.0"
description = "MCP server providing Philippine weather forecasts (Open-Meteo) to Claude Desktop"
readme = "README.md"
authors = [
    { name = "Jeffs0412", email = "manalejefferson@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "httpx2>=2.5.0",
    "mcp[cli]>=2.2.0",
]

[project.scripts]
weather = "weather:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
